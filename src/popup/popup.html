<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="popup_header_title"></title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-icon" src="../../assets/icons/icon48.png" alt="">
      <h1 data-i18n="popup_header_title"></h1>
    </div>
    <div class="topbar-actions">
      <button id="refreshBtn" class="action-chip" type="button" data-i18n-title="popup_header_refresh_title">
        <svg class="spin-target" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <polyline points="21 3 21 9 15 9"/>
        </svg>
        <span data-i18n="popup_action_refresh"></span>
      </button>
      <button id="reloadTabBtn" class="action-chip" type="button" data-i18n-title="popup_action_reload_tab_title">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
        <span data-i18n="popup_action_reload_tab"></span>
      </button>
      <button id="tabCaptureBtn" class="action-chip action-capture" type="button" data-i18n-title="popup_action_capture_tab_title">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
          <circle cx="12" cy="12" r="5"/>
        </svg>
        <span id="tabCaptureLabel" data-i18n="popup_action_capture_tab"></span>
      </button>
      <button id="clearBtn" class="icon-btn" type="button" data-i18n-title="popup_header_clear_title">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6"/>
          <path d="M14 11v6"/>
        </svg>
      </button>
      <button id="historyToggleBtn" class="icon-btn" type="button" data-i18n-title="popup_header_history_title" data-i18n-aria="popup_header_history_title" aria-expanded="false">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <polyline points="12 7 12 12 15 14"/>
        </svg>
      </button>
      <button id="sidePanelBtn" class="icon-btn side-panel-btn" type="button" data-i18n-title="popup_header_sidepanel_title" data-i18n-aria="popup_header_sidepanel_title">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="15" y1="3" x2="15" y2="21"/>
        </svg>
      </button>
      <button id="optionsBtn" class="icon-btn" type="button" data-i18n-title="popup_header_options_title">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <nav class="filters" data-i18n-aria="popup_filter_nav_label">
    <button class="filter-btn active" data-filter="all" type="button" aria-pressed="true">
      <span data-i18n="popup_filter_all"></span>
      <span class="count" id="countAll">0</span>
    </button>
    <button class="filter-btn" data-filter="videos" type="button" aria-pressed="false">
      <span data-i18n="popup_filter_videos"></span>
      <span class="count" id="countVideos">0</span>
    </button>
    <button class="filter-btn" data-filter="images" type="button" aria-pressed="false">
      <span data-i18n="popup_filter_images"></span>
      <span class="count" id="countImages">0</span>
    </button>
    <button class="filter-btn" data-filter="svg" type="button" aria-pressed="false">
      <span data-i18n="popup_filter_svg"></span>
      <span class="count" id="countSvg">0</span>
    </button>
    <button class="filter-btn" data-filter="audio" type="button" aria-pressed="false">
      <span data-i18n="popup_filter_audio"></span>
      <span class="count" id="countAudio">0</span>
    </button>
    <button class="filter-btn" data-filter="subtitles" type="button" aria-pressed="false">
      <span data-i18n="popup_filter_subtitles"></span>
      <span class="count" id="countSubtitles">0</span>
    </button>
  </nav>

  <div class="search-sort-bar">
    <input
      id="searchInput"
      class="search-input"
      type="search"
      data-i18n-placeholder="popup_search_placeholder"
      data-i18n-aria="popup_search_label"
    >
    <select id="sortSelect" class="sort-select" data-i18n-aria="popup_sort_label">
      <option value="default" data-i18n="popup_sort_default"></option>
      <option value="size_desc" data-i18n="popup_sort_size"></option>
      <option value="resolution_desc" data-i18n="popup_sort_resolution"></option>
      <option value="duration_desc" data-i18n="popup_sort_duration"></option>
    </select>
    <button id="viewModeBtn" class="icon-btn view-mode-btn" type="button" data-i18n-title="popup_action_view_grid" data-i18n-aria="popup_action_view_grid" aria-pressed="false">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
    </button>
  </div>

  <div id="imageFiltersBar" class="image-filters-bar hidden">
    <select id="minImagePxSelect" class="sort-select" data-i18n-aria="popup_image_min_px_label"></select>
    <select id="imageExtFilterSelect" class="sort-select" data-i18n-aria="popup_image_ext_label"></select>
    <select id="imageOrientationFilterSelect" class="sort-select" data-i18n-aria="popup_filter_orientation_label"></select>
    <select id="imageScaleSelect" class="sort-select" data-i18n-aria="popup_svg_scale_label"></select>
  </div>

  <div id="hintBanner" class="banner banner-info hidden" role="status" aria-live="polite"></div>
  <div id="statusBanner" class="banner banner-status hidden" role="status" aria-live="polite"></div>

  <div class="toolbar">
    <div id="selectionBar" class="toolbar-row hidden">
      <button id="selectAllBtn" class="btn btn-secondary btn-compact" type="button"></button>
      <button id="clearSelectionBtn" class="btn btn-secondary btn-compact hidden" type="button" data-i18n="popup_action_clear_selection"></button>
      <select id="imageConvertSelect" class="sort-select hidden" data-i18n-aria="popup_image_format_label">
        <option value="original" data-i18n="popup_image_format_original"></option>
        <option value="png" data-i18n="popup_image_format_png"></option>
        <option value="jpg" data-i18n="popup_image_format_jpg"></option>
      </select>
      <select id="zipRenameSelect" class="sort-select" data-i18n-aria="popup_zip_rename_label">
        <option value="original" data-i18n="popup_zip_rename_original"></option>
        <option value="sequential" data-i18n="popup_zip_rename_sequential"></option>
      </select>
      <button id="downloadSelectedBtn" class="btn btn-primary btn-compact" type="button" disabled></button>
      <button id="downloadZipBtn" class="btn btn-secondary btn-compact" type="button" disabled></button>
    </div>
    <button id="downloadAllBtn" class="btn btn-secondary hidden" type="button"></button>
    <button id="companionPageBtn" class="btn btn-secondary hidden" type="button" data-i18n="popup_action_companion_page"></button>
    <button id="stopBatchBtn" class="btn btn-cancel btn-full hidden" type="button" data-i18n="popup_action_stop_batch"></button>
    <div id="batchConfirmBar" class="batch-confirm hidden" role="group" aria-live="polite">
      <span id="batchConfirmText" class="batch-confirm-text"></span>
      <div class="batch-confirm-actions">
        <button id="batchConfirmBtn" class="btn btn-primary" type="button" data-i18n="popup_action_confirm_batch"></button>
        <button id="batchCancelBtn" class="btn btn-secondary btn-compact" type="button" data-i18n="popup_action_cancel_batch"></button>
      </div>
    </div>
  </div>

  <section id="historyDrawer" class="history-drawer hidden" aria-labelledby="historyHeading">
    <div class="history-header">
      <h2 id="historyHeading" class="history-title" data-i18n="popup_history_heading"></h2>
      <button id="historyClearBtn" class="btn btn-secondary btn-compact" type="button" data-i18n="popup_history_clear"></button>
    </div>
    <ul id="historyList" class="history-list"></ul>
    <p id="historyEmpty" class="history-empty hidden" data-i18n="popup_history_empty"></p>
  </section>

  <main id="mediaList" class="media-list"></main>

  <div id="imageLightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
    <div id="lightboxBackdrop" class="lightbox-backdrop"></div>
    <div class="lightbox-panel">
      <div class="lightbox-header">
        <span id="lightboxTitle" class="lightbox-title"></span>
        <span id="lightboxMeta" class="badge hidden"></span>
        <button id="lightboxCloseBtn" class="btn btn-secondary btn-compact" type="button" data-i18n="popup_lightbox_close"></button>
      </div>
      <div id="lightboxToolbar" class="lightbox-toolbar">
        <div class="lightbox-bg-group" role="group" data-i18n-title="popup_lightbox_bg_checker">
          <button id="lightboxBgCheckerBtn" class="action-chip is-active" type="button" data-i18n="popup_lightbox_bg_checker"></button>
          <button id="lightboxBgLightBtn" class="action-chip" type="button" data-i18n="popup_lightbox_bg_light"></button>
          <button id="lightboxBgDarkBtn" class="action-chip" type="button" data-i18n="popup_lightbox_bg_dark"></button>
        </div>
        <div class="lightbox-actions-group">
          <button id="lightboxCopyBtn" class="action-chip" type="button" data-i18n="popup_lightbox_copy_url"></button>
          <button id="lightboxDownloadBtn" class="btn btn-primary btn-compact" type="button" data-i18n="popup_lightbox_download"></button>
        </div>
      </div>
      <div id="lightboxPaletteBar" class="lightbox-palette-bar hidden">
        <span class="lightbox-palette-label" data-i18n="popup_lightbox_palette_label"></span>
        <div id="lightboxPaletteSwatches" class="lightbox-palette-swatches"></div>
        <button id="lightboxCurrentColorBtn" class="action-chip" type="button" data-i18n="popup_lightbox_current_color"></button>
        <button id="lightboxResetColorsBtn" class="action-chip hidden" type="button" data-i18n="popup_lightbox_reset_colors"></button>
      </div>
      <div id="lightboxStage" class="lightbox-stage is-bg-checker">
        <img id="lightboxImg" class="lightbox-img" alt="">
      </div>
    </div>
  </div>

  <script src="../vendor/mux-mp4.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
