<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="options_title"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <img class="brand-icon" src="../../assets/icons/icon48.png" alt="">
      <div>
        <h1 data-i18n="options_title"></h1>
        <p class="subtitle" data-i18n="options_subtitle"></p>
      </div>
    </header>

    <div id="statusBanner" class="status-banner hidden" role="status" aria-live="polite"></div>

    <form id="optionsForm" class="settings-form">
      <div class="field">
        <label for="defaultQuality" data-i18n="options_default_quality"></label>
        <select id="defaultQuality" name="defaultQuality">
          <option value="best" data-i18n="options_quality_best"></option>
          <option value="lowest" data-i18n="options_quality_lowest"></option>
        </select>
      </div>

      <div class="field">
        <label for="filenameTemplate" data-i18n="options_filename_template"></label>
        <select id="filenameTemplate" name="filenameTemplate">
          <option value="default" data-i18n="options_template_default"></option>
          <option value="host_stem" data-i18n="options_template_host_stem"></option>
          <option value="date_stem" data-i18n="options_template_date_stem"></option>
        </select>
      </div>

      <div class="field">
        <label for="minImageDimensionPx" data-i18n="options_min_image_px"></label>
        <input id="minImageDimensionPx" name="minImageDimensionPx" type="number" min="0" max="2000" step="1" required>
      </div>

      <div class="field">
        <label for="hlsFetchConcurrency" data-i18n="options_hls_concurrency"></label>
        <input id="hlsFetchConcurrency" name="hlsFetchConcurrency" type="number" min="1" max="8" step="1" required>
      </div>

      <div class="field">
        <label for="largeStreamWarningMb" data-i18n="options_large_stream_mb"></label>
        <input id="largeStreamWarningMb" name="largeStreamWarningMb" type="number" min="0" max="2048" step="10" required>
      </div>

      <label class="checkbox-field" for="enableXOverlay">
        <input id="enableXOverlay" name="enableXOverlay" type="checkbox">
        <span data-i18n="options_enable_x_overlay"></span>
      </label>

      <div class="actions">
        <button id="resetBtn" class="btn btn-secondary" type="button" data-i18n="options_action_reset"></button>
        <button id="saveBtn" class="btn btn-primary" type="submit" data-i18n="options_action_save"></button>
      </div>
    </form>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
