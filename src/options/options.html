<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="options_title"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <img class="brand-icon" src="../../assets/icons/icon48.png" alt="">
      <div>
        <h1 data-i18n="options_title"></h1>
        <p class="subtitle" data-i18n="options_subtitle"></p>
      </div>
    </header>

    <div id="statusBanner" class="status-banner hidden" role="status" aria-live="polite"></div>

    <form id="optionsForm" class="settings-form">
      <div class="field">
        <label for="defaultQuality" data-i18n="options_default_quality"></label>
        <select id="defaultQuality" name="defaultQuality">
          <option value="best" data-i18n="options_quality_best"></option>
          <option value="lowest" data-i18n="options_quality_lowest"></option>
        </select>
      </div>

      <div class="field">
        <label for="filenameTemplate" data-i18n="options_filename_template"></label>
        <select id="filenameTemplate" name="filenameTemplate">
          <option value="default" data-i18n="options_template_default"></option>
          <option value="host_stem" data-i18n="options_template_host_stem"></option>
          <option value="date_stem" data-i18n="options_template_date_stem"></option>
          <option value="host_folder" data-i18n="options_template_host_folder"></option>
          <option value="date_folder" data-i18n="options_template_date_folder"></option>
        </select>
      </div>

      <div class="field">
        <label for="minImageDimensionPx" data-i18n="options_min_image_px"></label>
        <input id="minImageDimensionPx" name="minImageDimensionPx" type="number" min="0" max="2000" step="1" aria-describedby="minImageDimensionHint" required>
        <p id="minImageDimensionHint" class="field-hint" data-i18n="options_min_image_px_hint"></p>
      </div>

      <div class="field">
        <label for="hlsFetchConcurrency" data-i18n="options_hls_concurrency"></label>
        <input id="hlsFetchConcurrency" name="hlsFetchConcurrency" type="number" min="1" max="8" step="1" aria-describedby="hlsFetchConcurrencyHint" required>
        <p id="hlsFetchConcurrencyHint" class="field-hint" data-i18n="options_hls_concurrency_hint"></p>
      </div>

      <div class="field">
        <label for="largeStreamWarningMb" data-i18n="options_large_stream_mb"></label>
        <input id="largeStreamWarningMb" name="largeStreamWarningMb" type="number" min="0" max="512" step="1" aria-describedby="largeStreamWarningHint" required>
        <p id="largeStreamWarningHint" class="field-hint" data-i18n="options_large_stream_mb_hint"></p>
      </div>

      <div class="field">
        <label for="jpgQualityPercent" data-i18n="options_jpg_quality_label"></label>
        <input id="jpgQualityPercent" name="jpgQualityPercent" type="number" min="50" max="100" step="1" aria-describedby="jpgQualityHint" required>
        <p id="jpgQualityHint" class="field-hint" data-i18n="options_jpg_quality_hint"></p>
      </div>

      <div class="field">
        <label for="maxImageResizePx" data-i18n="options_max_image_resize_label"></label>
        <select id="maxImageResizePx" name="maxImageResizePx" aria-describedby="maxImageResizeHint">
          <option value="0" data-i18n="options_max_image_resize_original"></option>
          <option value="512">512 px</option>
          <option value="1024">1024 px</option>
          <option value="1920">1920 px</option>
          <option value="2560">2560 px</option>
          <option value="3840">3840 px</option>
        </select>
        <p id="maxImageResizeHint" class="field-hint" data-i18n="options_max_image_resize_hint"></p>
      </div>

      <div class="field">
        <label for="audioExportFormat" data-i18n="options_audio_format_label"></label>
        <select id="audioExportFormat" name="audioExportFormat" aria-describedby="audioExportFormatHint">
          <option value="m4a" data-i18n="options_audio_format_m4a"></option>
          <option value="opus" data-i18n="options_audio_format_opus"></option>
          <option value="wav" data-i18n="options_audio_format_wav"></option>
        </select>
        <p id="audioExportFormatHint" class="field-hint" data-i18n="options_audio_format_hint"></p>
      </div>

      <div class="field">
        <label for="tabCaptureBitrateMbps" data-i18n="options_tab_capture_bitrate_label"></label>
        <input id="tabCaptureBitrateMbps" name="tabCaptureBitrateMbps" type="number" min="1" max="16" step="1" aria-describedby="tabCaptureBitrateHint" required>
        <p id="tabCaptureBitrateHint" class="field-hint" data-i18n="options_tab_capture_bitrate_hint"></p>
      </div>

      <label class="checkbox-field" for="enableXOverlay">
        <input id="enableXOverlay" name="enableXOverlay" type="checkbox">
        <span data-i18n="options_enable_x_overlay"></span>
      </label>

      <label class="checkbox-field" for="enableSocialOverlay">
        <input id="enableSocialOverlay" name="enableSocialOverlay" type="checkbox">
        <span data-i18n="options_enable_social_overlay"></span>
      </label>

      <label class="checkbox-field" for="enableGenericVideoOverlay">
        <input id="enableGenericVideoOverlay" name="enableGenericVideoOverlay" type="checkbox">
        <span data-i18n="options_enable_generic_overlay"></span>
      </label>

      <label class="checkbox-field" for="enableMseCapture">
        <input id="enableMseCapture" name="enableMseCapture" type="checkbox">
        <span data-i18n="options_enable_mse_capture"></span>
      </label>

      <div class="field">
        <label class="checkbox-field" for="enableCompanionCookies">
          <input id="enableCompanionCookies" name="enableCompanionCookies" type="checkbox" aria-describedby="companionCookiesHint">
          <span data-i18n="options_enable_companion_cookies"></span>
        </label>
        <p id="companionCookiesHint" class="field-hint" data-i18n="options_enable_companion_cookies_hint"></p>
      </div>

      <label class="checkbox-field" for="promptSaveAs">
        <input id="promptSaveAs" name="promptSaveAs" type="checkbox">
        <span data-i18n="options_prompt_save_as"></span>
      </label>

      <div id="resetConfirmBar" class="reset-confirm hidden" role="group" aria-live="polite">
        <span class="reset-confirm-text" data-i18n="options_confirm_reset"></span>
        <div class="reset-confirm-actions">
          <button id="resetCancelBtn" class="btn btn-secondary" type="button" data-i18n="options_action_cancel_reset"></button>
          <button id="resetConfirmBtn" class="btn btn-danger" type="button" data-i18n="options_action_confirm_reset"></button>
        </div>
      </div>

      <div class="actions">
        <span id="dirtyIndicator" class="dirty-badge hidden" data-i18n="options_unsaved_changes"></span>
        <button id="resetBtn" class="btn btn-secondary" type="button" data-i18n="options_action_reset"></button>
        <button id="saveBtn" class="btn btn-primary" type="submit" data-i18n="options_action_save"></button>
      </div>
    </form>

    <section class="companion-panel" aria-labelledby="companionSectionTitle">
      <div class="companion-header">
        <div>
          <h2 id="companionSectionTitle" class="companion-title" data-i18n="options_companion_title"></h2>
          <p class="field-hint" data-i18n="options_companion_desc"></p>
        </div>
        <button id="checkCompanionBtn" class="btn btn-secondary" type="button" data-i18n="options_companion_check"></button>
      </div>
      <div id="companionStatus" class="companion-status" role="status" aria-live="polite"></div>
      <p class="field-hint" data-i18n="options_companion_install_hint"></p>
      <div class="companion-cmd-row">
        <code id="companionCmd" class="companion-cmd">.\companion\install_companion.ps1 -ExtensionId &lt;EXTENSION_ID&gt;</code>
        <button id="copyCompanionCmdBtn" class="btn btn-secondary btn-compact" type="button" data-i18n-title="options_action_copy_cmd" data-i18n-aria="options_action_copy_cmd">
          <span data-i18n="options_action_copy_cmd"></span>
        </button>
      </div>
    </section>

    <section class="companion-panel" aria-labelledby="shortcutsSectionTitle">
      <div class="companion-header">
        <div>
          <h2 id="shortcutsSectionTitle" class="companion-title" data-i18n="options_shortcuts_title"></h2>
          <p class="field-hint" data-i18n="options_shortcuts_desc"></p>
        </div>
        <button id="openShortcutsBtn" class="btn btn-secondary btn-compact" type="button" data-i18n="options_action_configure_shortcuts"></button>
      </div>
    </section>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
