<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="saver_page_title"></title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --danger: #dc2626;
      --success: #0f766e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --border: #334155;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-hover: #0ea5e9;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .saver-card {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .source-box {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
      font-size: 13px;
      word-break: break-all;
    }
    .source-label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--muted);
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }
    .progress-track {
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 120ms linear;
    }
    .status-text {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }
    .status-text.is-error {
      color: var(--danger);
      font-weight: 600;
    }
    .status-text.is-done {
      color: var(--success);
      font-weight: 600;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="saver-card">
    <h1 data-i18n="saver_heading"></h1>
    <p class="subtitle" data-i18n="saver_subtitle"></p>
    <div class="source-box">
      <span class="source-label" data-i18n="saver_target_label"></span>
      <span id="sourceUrl">-</span>
    </div>
    <div class="actions">
      <button id="startBtn" class="btn btn-primary" type="button" data-i18n="saver_action_pick_file"></button>
      <button id="cancelBtn" class="btn btn-secondary hidden" type="button" data-i18n="saver_action_cancel"></button>
    </div>
    <div class="progress-track">
      <div id="progressBar" class="progress-fill"></div>
    </div>
    <p id="statusText" class="status-text" aria-live="polite" data-i18n="saver_status_ready"></p>
  </main>
  <script src="../vendor/mux-mp4.min.js"></script>
  <script type="module" src="stream_saver.js"></script>
</body>
</html>
