name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm test
      - run: npm run package
      - run: npm run package:firefox
      - name: Upload release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="docs/release-notes/${TAG}.md"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.zip --clobber
          elif [ -f "${NOTES_FILE}" ]; then
            gh release create "${TAG}" dist/*.zip --title "Media Harvest ${TAG}" --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" dist/*.zip --title "Media Harvest ${TAG}" --generate-notes
          fi
